<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NeoBank - Login</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/login.js" defer></script>
</head>
<body>
    <div class="login-container">
        <div class="brand">
            <h1>Neo<span>Bank</span></h1>
            <p>A nova era do seu ecossistema financeiro</p>
        </div>

        <div id="errorBanner" class="error-message"></div>

        <form id="loginForm" onsubmit="efetuarLogin(event)">
            <div class="form-group">
                <label for="login">Usuário / Login</label>
                <input type="text" id="login" placeholder="Digite seu login único" autocomplete="username">
            </div>

            <div class="form-group">
                <label for="senha">Senha de Acesso</label>
                <div class="password-wrapper">
                    <input type="password" id="senha" placeholder="••••••••" autocomplete="current-password">
                    <button type="button" class="toggle-password" aria-label="Mostrar senha">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path>
                            <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></circle>
                        </svg>
                    </button>
                </div>
            </div>

            <button type="submit" class="btn-login">Acessar Conta</button>
        </form>

        <div class="footer-links">
            <p>Ainda não tem conta? <a href="cadastro.html">Abra sua conta agora</a></p>
        </div>
    </div>
</body>
</html>
