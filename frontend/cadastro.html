<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NeoBank - Cadastro</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/cadastro.js" defer></script>
</head>
<body>

    <div class="login-container register-container">
        <div class="brand">
            <h1>Neo<span>Bank</span></h1>
            <p>Abra sua conta em poucos passos</p>
        </div>

        <div id="errorBanner" class="error-message"></div>
        <div id="successBanner" class="error-message" style="background-color: #dcfce7; border-color: #22c55e; color: #15803d;"></div>

        <form id="cadastroForm" onsubmit="efetuarCadastro(event)">
            
            <div class="form-group">
                <label for="nome">Nome Completo</label>
                <input type="text" id="nome" placeholder="Ex: João Silva" autocomplete="name">
            </div>

            <div class="form-group">
                <label for="tipoCliente">Tipo de Cliente (PF ou PJ)</label>
                <select id="tipoCliente">
                    <option value="">Selecione...</option>
                    <option value="PF">Pessoa Física (PF)</option>
                    <option value="PJ">Pessoa Jurídica (PJ)</option>
                </select>
            </div>

            <div class="form-group">
                <label for="tipoConta">Tipo de Conta</label>
                <select id="tipoConta" style="width: 100%; padding: 0.8rem; border: 2px solid var(--input-border); border-radius: 10px; font-size: 1rem; color: var(--text-main); outline: none;">
                    <option value="">Selecione...</option>
                    <option value="CORRENTE">Conta Corrente</option>
                    <option value="POUPANCA">Conta Poupança</option>
                </select>
            </div>

            <div class="form-group">
                <label for="documento">Documento (CPF/CNPJ)</label>
                <input type="text" id="documento" placeholder="Apenas números">
            </div>

            <div class="form-group">
                <label for="email">E-mail</label>
                <input type="email" id="email" placeholder="seuemail@exemplo.com">
            </div>

            <!-- edereços -->
            <div style="border-top: 1px solid var(--input-border); padding-top: 1rem; margin-top: 1rem;">
                <h3 style="margin-bottom: 1rem; font-size: 1.1rem; color: var(--text-main);">Endereço</h3>
                
                <div class="form-group">
                    <label for="cep">CEP</label>
                    <input type="text" id="cep" placeholder="Apenas números">
                </div>

                <div class="form-group">
                    <label for="rua">Rua / Avenida</label>
                    <input type="text" id="rua" placeholder="Ex: Rua das Flores">
                </div>

                <div style="display: flex; gap: 10px;">
                    <div class="form-group" style="flex: 1;">
                        <label for="numero">Número</label>
                        <input type="text" id="numero" placeholder="Ex: 123">
                    </div>
                    <div class="form-group" style="flex: 2;">
                        <label for="bairro">Bairro</label>
                        <input type="text" id="bairro" placeholder="Seu bairro">
                    </div>
                </div>

                <div style="display: flex; gap: 10px;">
                    <div class="form-group" style="flex: 2;">
                        <label for="cidade">Cidade</label>
                        <input type="text" id="cidade" placeholder="Sua cidade">
                    </div>
                    <div class="form-group" style="flex: 1;">
                        <label for="estado">Estado</label>
                        <input type="text" id="estado" placeholder="UF (Ex: SP)">
                    </div>
                </div>
            </div>

            <div class="form-group">
                <label for="senha">Crie uma Senha Forte</label>
                <div class="password-wrapper">
                    <input type="password" id="senha" placeholder="Mínimo 8 caracteres">
                    <button type="button" class="toggle-password" aria-label="Mostrar senha">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path>
                            <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></circle>
                        </svg>
                    </button>
                </div>
            </div>

            <button type="submit" class="btn-login">Finalizar Cadastro</button>
        </form>

        <div class="footer-links">
            <p>Já é cliente? <a href="index.html">Acesse sua conta</a></p>
        </div>
    </div>

</body>
</html>
